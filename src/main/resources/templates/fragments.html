
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="studentFields">

    <div class="field">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" th:field="*{fullName}"
               placeholder="Enter full name">
        <small class="error" th:errors="*{fullName}"></small>
    </div>

    <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" th:field="*{email}"
               placeholder="Enter email address">
        <small class="error" th:errors="*{email}"></small>
    </div>

    <div class="field">
        <label for="phone">Phone (10 digits)</label>
        <input type="tel" id="phone" th:field="*{phone}"
               placeholder="Enter 10-digit phone number">
        <small class="error" th:errors="*{phone}"></small>
    </div>

    <div class="field">
        <label for="course">Course</label>
        <select id="course" th:field="*{course}">
            <option value="">-- Select a course --</option>
            <option th:each="c : ${courses}"
                    th:value="${c}"
                    th:text="${c}">
            </option>
        </select>
        <small class="error" th:errors="*{course}"></small>
    </div>

    <div class="field">
        <label for="age">Age</label>
        <input type="number" id="age" th:field="*{age}"
               min="15" max="100" placeholder="Enter age">
        <small class="error" th:errors="*{age}"></small>
    </div>

</div>

</body>
</html>
